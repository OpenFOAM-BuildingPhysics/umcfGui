[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"
repository = "https://github.com/OpenFOAM-BuildingPhysics/umcfGui"

[workspace.dependencies]
# internal
umcf-core = { path = "crates/core" }
umcf-geom = { path = "crates/geom" }
umcf-schema = { path = "crates/schema" }
umcf-foam-dict = { path = "crates/foam-dict" }
umcf-foam-field = { path = "crates/foam-field" }
umcf-foam-mesh = { path = "crates/foam-mesh" }
umcf-model = { path = "crates/model" }
umcf-validate = { path = "crates/validate" }
umcf-render = { path = "crates/render" }
umcf-engine = { path = "crates/engine" }

# foundation
thiserror = "2"
serde_json = "1"
# Scanning the solver source (xtask catalog), and the quoted patch patterns of field files
# (validate), which OpenFOAM matches as regular expressions.
regex = "1"
# gzip-compressed case files (writeCompression on). zlib-rs: pure Rust, about twice the speed of
# the miniz_oxide backend on multi-GB fields.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Correctly rounded float parsing, several times faster than str::parse on long number lists.
fast-float2 = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
