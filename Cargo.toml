[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"
repository = "https://github.com/OpenFOAM-BuildingPhysics/umcfGui"

[workspace.dependencies]
# internal
umcf-foam-dict = { path = "crates/foam-dict" }

# foundation
thiserror = "2"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
