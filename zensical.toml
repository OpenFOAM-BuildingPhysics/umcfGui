[project]
site_name = "umcfGui"
site_description = "An open-source GUI for urbanMicroclimateFoam: set up, run and inspect urban microclimate simulations"
site_url = "https://openfoam-buildingphysics.github.io/umcfGui/"
repo_url = "https://github.com/OpenFOAM-BuildingPhysics/umcfGui"
repo_name = "OpenFOAM-BuildingPhysics/umcfGui"
copyright = "Copyright &copy; 2026 the umcfGui contributors · GPL-3.0-or-later"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "User Guide" = [
    "user-guide/index.md",
    "user-guide/cases.md",
    "user-guide/openfoam-versions.md",
    "user-guide/dictionaries.md",
    "user-guide/fields.md",
  ] },
  { "Solver Coverage" = "solver-coverage.md" },
  { "Architecture" = "architecture.md" },
  { "Contributing" = "contributing.md" },
  { "urbanMicroclimateFoam" = "https://github.com/OpenFOAM-BuildingPhysics/urbanMicroclimateFoam" },
  { "Report Issues" = "https://github.com/OpenFOAM-BuildingPhysics/umcfGui/issues" },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.keys]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/OpenFOAM-BuildingPhysics/umcfGui"
name = "umcfGui on GitHub"
