[package]
name = "umcf-ui-egui"
description = "The umcfGui desktop interface in egui: a ribbon and command search built from the command registry, the case browser, the properties and the 3D view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
umcf-engine.workspace = true
umcf-render.workspace = true
umcf-geom.workspace = true
umcf-model.workspace = true
serde_json.workspace = true
# Waits for the GPU adapter the GPU view probes for at start (wgpu is asynchronous).
pollster = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu", "x11", "wayland", "accesskit", "clipboard"] }

[dev-dependencies]
umcf-core.workspace = true
umcf-foam-mesh.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
