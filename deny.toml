# cargo deny check licenses (run by `cargo xtask ci` when cargo-deny is installed).
# umcfGui is GPL-3.0-or-later: every dependency's licence must be GPL-3-compatible.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Boost: permissive and GPL-compatible (FSF); the Windows clipboard crates (clipboard-win,
    # error-code) that egui's copy and paste uses.
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "OFL-1.1",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list covers dependencies to come (egui, …): an allowance nothing uses yet is fine.
unused-allowed-license = "allow"
